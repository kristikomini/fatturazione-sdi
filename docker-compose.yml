services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fatturapa
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: [ "5432:5432" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d fatturapa" ]
      interval: 5s
      timeout: 3s
      retries: 10

