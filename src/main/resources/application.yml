spring:
  application:
    name: fatturazione-sdi
  datasource:
    url: jdbc:postgresql://localhost:5432/fatturapa
    username: app
    password: app
  jpa:
    hibernate:
      ddl-auto: validate     # schema owned by Flyway (standards rule 1)
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
